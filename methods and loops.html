<!DOCTYPE html>
<html>
<body>

  <p id="numbers"></p>
  <p id="random"></p>
  <p id="day"></p>

  <script>
    // PART 1: the numbers 1 to 10
    var text = "";
    for (var i = 1; i <= 10; i++) {
      text = text + i + "<br>";
    }
    document.getElementById("numbers").innerHTML = text;


    // PART 2: a random whole number
    var num = Math.floor(Math.random() * 100);
    document.getElementById("random").innerHTML = "The random number is " + num;


    // PART 3: today's day number
    var day = new Date().getDay();
    document.getElementById("day").innerHTML = "Today's day number is " + day;
  </script>

</body>
</html>
