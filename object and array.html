
<!DOCTYPE html>
<html>
<head>
    <title>Object and Array</title>
</head>
<body>

    <h1>Object Data Structure and Array</h1>

    <script>
        let student = {
            name: "Alex",
            age: 16
        };

        document.write(student.name + "<br>");

        let colours = ["Red", "Blue", "Green"];

        document.write(colours[0] + "<br>");
        document.write(colours.join(", ") + "<br>");

        colours.pop();

        document.write(colours);
    </script>

</body>
</html>
