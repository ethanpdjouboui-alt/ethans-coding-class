<!DOCTYPE html>
<html >
<head>
    <title>My daily fitnes routine</title>
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
            width: 750px;
            background-image: linear-gradient(to top right, #1e90ff, #87cefa,rgb(43, 128, 255) , rgb(102, 131, 249));
            
        }

        #box1{
            background-color: rgb(72, 119, 225);
            align-items: center ;
            border: 5px solid rgb(0, 60, 133);
            border-radius: 14px;
            width: 1150px;
            padding: 20px;
            
            
        }

        h1{
            text-align: center;
        }

        

       
    .workout {
      width: 210px;
      height: 260px;
      float: left;
      margin: 20px;
      padding: 18px;
      border: 3px solid rgb(0, 60, 133);
      border-radius: 14px;
      background-color:rgb(72, 119, 225);
    }

       
        
    </style>
</head>
<body>

    <h1>My daily fitness routine</h1>
    
    <div id="box1">

    <p>Three simple exercise you can do at home in 10 minutes.
        No equipment needed.
    </p>
    </div>

    <h2>Routine cards</h2>

    

    <div class="workout">
        <h4>squats</h4>
        <p>3 sets of 12 reps</p>
    </div>

    

    <div class="workout">
        <h4>Push-ups</h4>
        <p>3 sets of 10 reps</p>
    </div>

    

    <div class="workout">
        <h4>Plank</h4>
        <p>Hold for 45 seconds</p>
    </div>
    
</body>
</html>
