<!DOCTYPE html>
<html>
<head>
  <title>My Favourite Person Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="card p-3" style="width: 300px;">
    <h3 id="name"></h3>
    <p id="age"></p>
    <p id="relation"></p>
    <p id="hobby"></p>
  </div>

  <script>
    // Create an object to store profile information
    var person = {
      name: "Juda",
      age: 13,
      relation: "Best Friend",
      hobby: "Basketball and Gaming"
    };

    // Display properties using dot notation and bracket notation
    document.getElementById("name").innerHTML = person.name;
    document.getElementById("age").innerHTML = "Age: " + person["age"];
    document.getElementById("relation").innerHTML = "Relation: " + person.relation;
    document.getElementById("hobby").innerHTML = "Hobby: " + person["hobby"];
  </script>

</body>
</html>
